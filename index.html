<style>
/* Layout: iOS-style app shell — fixed translucent nav bar, large titles on tab roots,
   inset grouped lists, fixed bottom tab bar; one reading column (max 720px) */
:root{
  --bg:#f2f4f3; --cell:#ffffff; --cell-press:#e4e9e7; --ink:#111816; --ink2:#5e6b67; --ink3:#9aa5a1;
  --sep:rgba(60,72,68,.18); --tint:#0d7a66; --tint-soft:#dcefea; --bar:rgba(246,248,247,.82);
  --mark:#ffe27a; --mark-ink:#111816; --star:#e09b00; --danger:#c8372d;
  --f-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,monospace;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1b1f1e; --cell-press:#2b3230; --ink:#eef3f1; --ink2:#a1aeaa; --ink3:#6b7774;
  --sep:rgba(160,180,174,.2); --tint:#3fd0ae; --tint-soft:#14342d; --bar:rgba(20,23,22,.8);
  --mark:#6d5b10; --mark-ink:#fff4c8; --star:#ffbe3d; --danger:#ff6b5f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1b1f1e; --cell-press:#2b3230; --ink:#eef3f1; --ink2:#a1aeaa; --ink3:#6b7774;
  --sep:rgba(160,180,174,.2); --tint:#3fd0ae; --tint-soft:#14342d; --bar:rgba(20,23,22,.8);
  --mark:#6d5b10; --mark-ink:#fff4c8; --star:#ffbe3d; --danger:#ff6b5f; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sbox input:focus-visible{outline:none;box-shadow:0 0 0 2px var(--tint-soft)}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:52px calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

/* nav bar */
.nav{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav-in{max-width:736px;margin:0 auto;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav-title{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;opacity:0;transition:opacity .15s}
.nav.show-title .nav-title{opacity:1}
.nav-left{justify-self:start;display:flex}
.nav-right{justify-self:end;display:flex;gap:4px}
.nbtn{color:var(--tint);font-size:17px;height:44px;min-width:44px;padding:0 8px;display:inline-flex;align-items:center;gap:2px}
.nbtn svg{width:22px;height:22px}
.nbtn.back svg{width:13px;height:21px;margin-right:4px}
.nbtn[aria-pressed="true"] .ic-star{fill:var(--star);stroke:var(--star)}
.nbtn:active{opacity:.4}

/* large title */
.large{font-size:32px;font-weight:700;letter-spacing:.01em;margin:6px 4px 10px;line-height:1.2}
.sub{color:var(--ink2);font-size:13px;margin:-6px 4px 12px}

/* search field + segmented */
.sfield{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sbox{flex:1;min-width:0;position:relative}
.sbox svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink3)}
.sbox input{width:100%;height:38px;border:0;border-radius:11px;background:var(--cell-press);color:var(--ink);font:inherit;font-size:17px;padding:0 34px 0 34px;-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--ink3)}
.sbox input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.clear svg{position:static;transform:none;width:17px;height:17px}
.cancel{color:var(--tint);font-size:17px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--cell-press);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{height:30px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* grouped list */
.ghead{font-size:13px;color:var(--ink2);margin:22px 16px 7px;letter-spacing:.02em}
.ghead:first-child{margin-top:4px}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:46px;padding:11px 14px 11px 16px;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.ind + .cell.ind::before{left:58px}
.cell:active{background:var(--cell-press)}
.cell .body{flex:1;min-width:0;display:grid;gap:2px}
.cell .t{font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.cell .s{font-size:13px;color:var(--ink2);line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .k{font-family:var(--f-num);font-size:12px;color:var(--tint);font-variant-numeric:tabular-nums}
.cell .r{flex:none;color:var(--ink3);font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.chev{width:8px;height:13px;flex:none;color:var(--ink3)}
.badge{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--ink2);margin:8px 16px 0;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--cell);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink)}
.chip:active{background:var(--cell-press)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--ink2);padding:56px 20px;display:grid;gap:8px;justify-items:center}
.empty svg{width:44px;height:44px;color:var(--ink3)}
.empty b{color:var(--ink);font-size:17px}
.count{font-size:13px;color:var(--ink2);margin:0 16px 8px}
.pgjump{display:flex;gap:8px;align-items:center;flex:1}
.pgjump input{width:6.5em;height:34px;border:0;border-radius:8px;background:var(--cell-press);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;text-align:right;font-variant-numeric:tabular-nums}
.pgjump button{color:var(--tint);font-weight:600}

/* detail */
.dhead{margin:8px 4px 14px;display:grid;gap:6px}
.crumb{font-size:13px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb .k{font-family:var(--f-num);color:var(--tint);font-weight:600}
.dtitle{font-size:calc(var(--fs) + 5px);font-weight:700;line-height:1.4;text-wrap:balance;margin:0}
.card{background:var(--cell);border-radius:14px;padding:16px;display:grid;grid-template-columns:28px 1fr;gap:12px;margin-bottom:12px}
.card .lab{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--tint-soft);color:var(--tint)}
.card.a .lab{background:var(--tint);color:#fff}
.card .txt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;font-size:var(--fs);line-height:1.8}
.ref{display:block;font-size:13px;color:var(--ink2);line-height:1.55;margin-top:6px}
.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.tbtn{background:var(--cell);border-radius:12px;padding:10px 4px 8px;display:grid;justify-items:center;gap:3px;font-size:12px;color:var(--tint)}
.tbtn svg{width:22px;height:22px}
.tbtn:active{background:var(--cell-press)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{background:var(--cell);border-radius:12px;padding:10px 14px;text-align:left;display:grid;gap:1px;min-width:0}
.pbtn:last-child{text-align:right}
.pbtn small{font-size:12px;color:var(--ink2)}
.pbtn span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn:active{background:var(--cell-press)}
.pbtn[disabled]{visibility:hidden}
.hint{font-size:12px;color:var(--ink3);text-align:center;margin-top:12px}
.pagetext{background:var(--cell);border-radius:14px;padding:16px;display:grid;gap:.75em;font-size:calc(var(--fs) - 1px);line-height:1.85;overflow-wrap:anywhere}
.pagetext p{margin:0}

/* tab bar */
.tabbar{position:fixed;inset:auto 0 0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:50px}
.tab{display:grid;justify-items:center;align-content:center;gap:1px;font-size:10px;font-weight:500;color:var(--ink3)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--tint)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);opacity:0;z-index:30;
  background:rgba(30,36,34,.92);color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:no-preference){
  .push{animation:push .28s cubic-bezier(.2,.8,.2,1)}
  .pop{animation:pop .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes push{from{transform:translateX(28%);opacity:.3}to{transform:none;opacity:1}}
  @keyframes pop{from{transform:translateX(-18%);opacity:.4}to{transform:none;opacity:1}}
}
</style>

</div></nav>

  <button class="tab" role="tab" data-tab="search" id="tab-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>検索</button>
  <button class="tab" role="tab" data-tab="toc" id="tab-toc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>目次</button>
  <button class="tab" role="tab" data-tab="fav" id="tab-fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>お気に入り</button>
  <button class="tab" role="tab" data-tab="hist" id="tab-hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>履歴</button>
</div></div>

<div id="lock" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px">
  <form id="lf" style="width:100%;max-width:340px;display:grid;gap:14px;text-align:center">
    <div style="font-size:22px;font-weight:700">訪問看護実務相談Q&amp;A</div>
    <div style="color:var(--ink2);font-size:14px" id="lmsg">パスワードを入力してください（最初の1回だけ）</div>
    <input id="pw" type="password" autocomplete="current-password" style="height:46px;border:0;border-radius:12px;background:var(--cell);color:var(--ink);font:inherit;font-size:18px;padding:0 14px" aria-label="パスワード">
    <button style="height:46px;border-radius:12px;background:var(--tint);color:#fff;font-weight:700;font-size:17px">開く</button>
  </form>
</div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function loadData(rawKey){
  const r=await fetch('data.enc',{cache:'no-cache'}).catch(()=>caches.match('data.enc'));
  const buf=new Uint8Array(await r.arrayBuffer());
  const salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  return {salt,iv,ct};
}
async function derive(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,256));
}
async function open_(raw,blob){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:blob.iv},key,blob.ct);
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  window.__D=JSON.parse(txt);
  document.getElementById('lock').remove();
  const s=document.createElement('script');s.src='app.js?v=202610311008';document.body.appendChild(s);
}
(async()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const blob=await loadData();
  let saved=null; try{saved=localStorage.getItem('k')}catch(e){}
  if(saved){ try{ await open_(b64(saved),blob); return }catch(e){ try{localStorage.removeItem('k')}catch(_){} } }
  document.getElementById('lf').onsubmit=async e=>{e.preventDefault();
    const msg=document.getElementById('lmsg'); msg.textContent='開いています…';
    try{ const raw=await derive(document.getElementById('pw').value,blob.salt); await open_(raw,blob);
      try{localStorage.setItem('k',btoa(String.fromCharCode(...raw)))}catch(_){} }
    catch(err){ msg.textContent='パスワードが違います'; }
  };
})();
</script>
